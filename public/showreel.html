<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AUA Showreel</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000; /* yon tomon qora bo'lib turadi */
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 🔥 to'liq to'ldiradi (zoom + crop) */
        display: block;
      }
    </style>
  </head>
  <body>
    <video
      src="/video.mp4"
      autoplay
      muted
      loop
      playsinline
      controls
    ></video>
  </body>
</html>
